name: Sync Leetcode
on:
  workflow_dispatch:
  schedule:
    - cron: "0 0 */1 * *" # Runs once a day

permissions:
  contents: write

concurrency:
  group: leetcode-sync
  cancel-in-progress: false

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repo
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: pip install requests

      - name: Sync all LeetCode submissions (accepted + unsuccessful)
        env:
          LEETCODE_SESSION: ${{ secrets.LEETCODE_SESSION }}
          LEETCODE_CSRF_TOKEN: ${{ secrets.LEETCODE_CSRF_TOKEN }}
          DESTINATION_FOLDER: "Solutions"
        run: python sync_leetcode.py

      - name: Commit and push changes
        run: |
          git config user.name "aman-payal"
          git config user.email "ID+your-github-aman-payal@users.noreply.github.com"
          git add "Solutions"
          if git diff --cached --quiet; then
            echo "No new submissions to commit."
            exit 0
          fi
          git commit -m "Sync LeetCode submissions (accepted + unsuccessful)"

          # The remote may have moved since checkout (e.g. an overlapping
          # run, or another push). Retry with a rebase pull a few times
          # before giving up.
          for attempt in 1 2 3 4 5; do
            if git push; then
              echo "Pushed successfully."
              exit 0
            fi
            echo "Push rejected (attempt $attempt/5), pulling and retrying..."
            git pull --rebase origin main
            sleep 5
          done

          echo "Failed to push after retries."
          exit 1
